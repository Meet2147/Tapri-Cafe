# tapri.dashovia.cafe
#
# A static site: the landing page and the Sparkle update feed deploy together,
# so publishing the site publishes the updates. No server, no start command.
services:
  - type: web
    name: tapri
    runtime: static
    buildCommand: "echo 'static site — nothing to build'"
    staticPublishPath: .

    headers:
      # Sparkle polls this daily. A long cache leaves customers on a stale feed
      # for hours after a release goes out.
      - path: /updates/appcast.xml
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /updates/appcast.xml
        name: Content-Type
        value: application/xml; charset=utf-8

      # Disk images are immutable — the filename carries the version, so a new
      # release is a new URL and nothing is ever overwritten in place.
      - path: /updates/*.dmg
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /updates/*.delta
        name: Cache-Control
        value: public, max-age=31536000, immutable

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    routes:
      - type: redirect
        source: /download
        destination: /updates/Tapri-0.1.1.dmg
